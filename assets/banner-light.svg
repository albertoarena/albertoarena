<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Alberto Arena, senior software engineer, developer tooling for Laravel and event sourcing. An ER diagram in the style of Truss: filament_truss and homebrew_truss both reference laravel_truss.">
  <style>
    .edge, .mark, .one { fill: none; stroke: #2b8bf0; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .edge { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 1.2s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .mark, .one { animation: show 0.5s ease-out both; }
    .a.edge { animation-delay: 0.4s; }
    .b.edge { animation-delay: 0.6s; }
    .a.mark { animation-delay: 0.35s; }
    .b.mark { animation-delay: 0.55s; }
    .one { animation-delay: 1.1s; }
    @keyframes draw { from { stroke-dashoffset: 1; } }
    @keyframes show { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .edge, .mark, .one { animation: none; } }
  </style>
  <rect width="1200" height="300" fill="#ffffff"/>

  <!-- gutter rule -->
  <rect x="64" y="72" width="3" height="156" fill="#2b8bf0"/>

  <!-- name -->
  <text x="96" y="146" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="600" letter-spacing="-1.4" fill="#0f1720">Alberto Arena</text>

  <!-- tagline -->
  <text x="98" y="188" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5b6773">Developer tooling for Laravel and event sourcing</text>

  <!-- utility line -->
  <text x="98" y="226" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="0.4" fill="#6e7781">albertoarena.it · Messina, Italy · 100% remote</text>

  <!-- ER diagram: the Truss family, drawn the way Truss draws a schema -->
