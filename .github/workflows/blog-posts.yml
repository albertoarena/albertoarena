name: Latest blog posts

on:
  schedule:
    # every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest posts from the feed
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://albertoarena.it/rss.xml"
          max_post_count: 5
          template: "- $date · [$title]($url)$newline"
          date_format: "mmm d, yyyy"
          commit_message: "chore: update latest blog posts"
          # The default rss-parser user agent times out against the site,
          # so use a browser agent and retry on transient failures.
          user_agent: "Mozilla/5.0 (compatible; blog-post-workflow/1.0)"
          retry_count: 3
          retry_wait_time: 5
